services:
  backend:
    # Defaults to the rolling latest release. Override from the shell when
    # deploying another repository or a pinned release, for example:
    # IMAGE_TAG=v0.0.2 docker compose up -d
    # IMAGE_REPOSITORY=ghcr.io/example/douyin-web IMAGE_TAG=0.0.2 docker compose up -d
    image: ${IMAGE_REPOSITORY:-ghcr.io/yetianxingshi/douyin-ytdlp-web}:${IMAGE_TAG:-latest}
    environment:
      # Replace this placeholder before exposing the service.
      ADMIN_TOKEN: "replace-with-a-long-random-token"
      DOUYIN_COOKIE_FILE: /run/secrets/douyin_cookies
      DOUYIN_USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
      DOWNLOAD_ROOT: /app/downloads
      STATE_DIR: /app/state
      DATABASE_FILE: /app/state/jobs.sqlite3
      DOWNLOAD_ARCHIVE: /app/state/download-archive.txt
    volumes:
      - ./downloads:/app/downloads
      - ./state:/app/state
    secrets:
      - douyin_cookies
    ports:
      - "8000:8000"

secrets:
  douyin_cookies:
    # Put a Netscape/Mozilla cookie export at this path. Keep it out of Git.
    file: ./cookie/douyin-cookies.txt
